<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" id="diagram">

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b27"/>
    </linearGradient>

    <!-- Input box gradient -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f2744"/>
    </linearGradient>

    <!-- Agent box gradient -->
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#1a0f33"/>
    </linearGradient>

    <!-- Tool box gradients -->
    <linearGradient id="tool1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3d2e"/>
      <stop offset="100%" style="stop-color:#071f18"/>
    </linearGradient>
    <linearGradient id="tool2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2a0f"/>
      <stop offset="100%" style="stop-color:#1f1507"/>
    </linearGradient>
    <linearGradient id="tool3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2e4a"/>
      <stop offset="100%" style="stop-color:#0d1a2e"/>
    </linearGradient>

    <!-- Output box gradient -->
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f3a1a"/>
      <stop offset="100%" style="stop-color:#0d1f0a"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9eff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>

    <!-- Glow filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="620" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
  </pattern>
  <rect width="720" height="620" fill="url(#grid)" rx="16"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#e2e8f0" letter-spacing="2">AI TRAVEL PLANNER</text>
  <text x="360" y="54" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" letter-spacing="3">ARCHITECTURE PIPELINE</text>
  <line x1="200" y1="63" x2="520" y2="63" stroke="#334155" stroke-width="1"/>

  <!-- ═══ NODE 1: User Input ═══ -->
  <g filter="url(#softShadow)">
    <rect x="235" y="82" width="250" height="72" rx="12" fill="url(#inputGrad)" stroke="#4a9eff" stroke-width="1.5"/>
    <rect x="235" y="82" width="250" height="72" rx="12" fill="none" stroke="#4a9eff44" stroke-width="6"/>
  </g>
  <!-- Icon area -->
  <rect x="252" y="99" width="36" height="36" rx="8" fill="#4a9eff22"/>
  <text x="270" y="122" text-anchor="middle" font-family="monospace" font-size="18" fill="#4a9eff">&lt;/&gt;</text>
  <!-- Labels -->
  <text x="310" y="108" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">User Input</text>
  <text x="310" y="126" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Destination / Budget</text>
  <text x="310" y="143" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Natural Language Query</text>
  <!-- Corner badge -->
  <rect x="444" y="88" width="33" height="16" rx="4" fill="#4a9eff22"/>
  <text x="460" y="100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#4a9eff" font-weight="600">INPUT</text>

  <!-- Arrow: Input -> Agent -->
  <line x1="360" y1="154" x2="360" y2="188" stroke="#4a9eff" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrowBlue)" filter="url(#glowBlue)"/>

  <!-- ═══ NODE 2: GPT-4o Planner / LangChain Agent ═══ -->
  <g filter="url(#softShadow)">
    <rect x="210" y="192" width="300" height="76" rx="12" fill="url(#agentGrad)" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="210" y="192" width="300" height="76" rx="12" fill="none" stroke="#a78bfa44" stroke-width="6"/>
  </g>
  <!-- Icon -->
  <rect x="227" y="209" width="36" height="36" rx="8" fill="#a78bfa22"/>
  <circle cx="245" cy="227" r="9" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="245" cy="227" r="3" fill="#a78bfa"/>
  <!-- Labels -->
  <text x="278" y="217" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">GPT-4o Planner</text>
  <text x="278" y="234" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c4b5fd">LangChain Agent</text>
  <text x="278" y="252" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7c3aed">Orchestration + Reasoning Layer</text>
  <!-- Badge -->
  <rect x="468" y="198" width="34" height="16" rx="4" fill="#a78bfa22"/>
  <text x="485" y="210" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#a78bfa" font-weight="600">AGENT</text>

  <!-- Arrow: Agent -> Three branches (vertical down then split) -->
  <!-- Main stem down -->
  <line x1="360" y1="268" x2="360" y2="300" stroke="#a78bfa" stroke-width="2" filter="url(#glowBlue)"/>
  <!-- Horizontal bar -->
  <line x1="104" y1="300" x2="616" y2="300" stroke="#a78bfa" stroke-width="2" filter="url(#glowBlue)"/>
  <!-- Left branch down -->
  <line x1="104" y1="300" x2="104" y2="336" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)" filter="url(#glowGreen)"/>
  <!-- Center branch down -->
  <line x1="360" y1="300" x2="360" y2="336" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Right branch down -->
  <line x1="616" y1="300" x2="616" y2="336" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ═══ NODE 3a: Google Places API ═══ -->
  <g filter="url(#softShadow)">
    <rect x="28" y="340" width="152" height="80" rx="10" fill="url(#tool1Grad)" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="28" y="340" width="152" height="80" rx="10" fill="none" stroke="#4ade8033" stroke-width="5"/>
  </g>
  <rect x="42" y="354" width="28" height="28" rx="6" fill="#4ade8022"/>
  <text x="56" y="372" text-anchor="middle" font-size="14" fill="#4ade80">◆</text>
  <text x="80" y="362" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Google Places</text>
  <text x="80" y="377" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac">API Tool</text>
  <text x="80" y="392" font-family="'Segoe UI', sans-serif" font-size="9" fill="#4ade8088">Location Data</text>
  <rect x="138" y="345" width="36" height="14" rx="3" fill="#4ade8022"/>
  <text x="156" y="355" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#4ade80" font-weight="600">PLACES</text>

  <!-- ═══ NODE 3b: Budget Engine ═══ -->
  <g filter="url(#softShadow)">
    <rect x="284" y="340" width="152" height="80" rx="10" fill="url(#tool2Grad)" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="284" y="340" width="152" height="80" rx="10" fill="none" stroke="#fb923c33" stroke-width="5"/>
  </g>
  <rect x="298" y="354" width="28" height="28" rx="6" fill="#fb923c22"/>
  <text x="312" y="373" text-anchor="middle" font-size="14" fill="#fb923c">$</text>
  <text x="336" y="362" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Budget Engine</text>
  <text x="336" y="377" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fdba74">Optimization</text>
  <text x="336" y="392" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fb923c88">Cost Analysis</text>
  <rect x="394" y="345" width="34" height="14" rx="3" fill="#fb923c22"/>
  <text x="411" y="355" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#fb923c" font-weight="600">BUDGET</text>

  <!-- ═══ NODE 3c: Hotel Selector ═══ -->
  <g filter="url(#softShadow)">
    <rect x="540" y="340" width="152" height="80" rx="10" fill="url(#tool3Grad)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="540" y="340" width="152" height="80" rx="10" fill="none" stroke="#60a5fa33" stroke-width="5"/>
  </g>
  <rect x="554" y="354" width="28" height="28" rx="6" fill="#60a5fa22"/>
  <text x="568" y="373" text-anchor="middle" font-size="14" fill="#60a5fa">H</text>
  <text x="593" y="362" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Hotel Selector</text>
  <text x="593" y="377" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd">Recommendation</text>
  <text x="593" y="392" font-family="'Segoe UI', sans-serif" font-size="9" fill="#60a5fa88">Smart Matching</text>
  <rect x="652" y="345" width="32" height="14" rx="3" fill="#60a5fa22"/>
  <text x="668" y="355" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#60a5fa" font-weight="600">HOTEL</text>

  <!-- Converging arrows to output -->
  <!-- Left tool -> bottom merge -->
  <line x1="104" y1="420" x2="104" y2="470" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="104" y1="470" x2="320" y2="470" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="320" y1="470" x2="320" y2="495" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Center tool -> output -->
  <line x1="360" y1="420" x2="360" y2="495" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Right tool -> bottom merge -->
  <line x1="616" y1="420" x2="616" y2="470" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="616" y1="470" x2="400" y2="470" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="400" y1="470" x2="400" y2="495" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- ═══ NODE 4: Final AI Itinerary ═══ -->
  <g filter="url(#glowGreen)">
    <g filter="url(#softShadow)">
      <rect x="185" y="498" width="350" height="78" rx="14" fill="url(#outputGrad)" stroke="#4ade80" stroke-width="2"/>
      <rect x="185" y="498" width="350" height="78" rx="14" fill="none" stroke="#4ade8022" stroke-width="8"/>
    </g>
  </g>
  <!-- Star/spark decorations -->
  <text x="205" y="528" font-size="16" fill="#4ade80" opacity="0.7">*</text>
  <text x="516" y="528" font-size="16" fill="#4ade80" opacity="0.7">*</text>
  <!-- Icon -->
  <rect x="202" y="514" width="32" height="32" rx="7" fill="#4ade8022"/>
  <text x="218" y="534" text-anchor="middle" font-size="15" fill="#4ade80">■</text>
  <!-- Labels -->
  <text x="360" y="521" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Final AI Itinerary</text>
  <text x="360" y="540" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#86efac">Personalized Travel Plan</text>
  <text x="360" y="558" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4ade80bb">Day-by-day schedule + Hotels + Budget breakdown</text>
  <!-- Badge -->
  <rect x="480" y="504" width="45" height="15" rx="4" fill="#4ade8022"/>
  <text x="502" y="515" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#4ade80" font-weight="600">OUTPUT</text>

  <!-- Footer -->
  <text x="360" y="600" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#334155" letter-spacing="2">AI TRAVEL PIPELINE v1.0</text>

</svg>